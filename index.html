<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 스케줄 플래너</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Pretendard Variable Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    /* 여기어때 잘난체 WebFont 선언 */
    @font-face {
      font-family: 'YeogiOttaeJalnan';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 디자인 시스템 기초 규칙 적용 */
    :root {
      --primary-red: #F94239;
      --cyan-800: #1D8BFF;
      --green-800: #01A484;
      --neutral-10: #FAFAFA;
      --neutral-50: #F5F5F5;
      --neutral-100: #E6E6E6;
      --neutral-200: #DCDCDC;
      --neutral-400: #999999;
      --neutral-700: #5C5C5C;
      --neutral-900: #222222;
    }

    /* 글로벌 타이포그래피 & 텍스트 인터랙션 규칙 */
    * {
      word-break: keep-all;
      user-select: none;
      -webkit-user-select: none;
      outline: none !important;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #1A1A1A;
      color: var(--neutral-900);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-jalnan {
      font-family: 'YeogiOttaeJalnan', "Pretendard Variable", sans-serif;
    }

    .num-tabular {
      font-variant-numeric: tabular-nums;
    }

    button, .tab-item, .chip-item, .badge-item {
      white-space: nowrap;
    }

    /* YDS 그림자 규격 */
    .shadow-flat {
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .shadow-header {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--neutral-200);
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen flex justify-center bg-[#1A1A1A]">

  <!-- 모바일 메인 컨테이너 (최대 너비 sm 제한, 핸드폰 프레임 최적화) -->
  <div class="w-full max-w-md bg-[#F5F5F5] h-full flex flex-col relative overflow-hidden shadow-2xl">

    <!-- 모바일 상단 헤더 -->
    <header class="h-14 bg-white border-b border-[#E6E6E6] px-4 flex items-center justify-between z-30 shadow-header shrink-0">
      <div class="flex items-center space-x-2">
        <span class="font-jalnan text-[#F94239] text-lg tracking-tight">여기어때</span>
        <span class="text-[10px] px-1.5 py-0.5 bg-[#FFF5F5] text-[#F94239] font-bold rounded border border-[#FEDFDE]">스케줄</span>
      </div>
    </header>

    <!-- 메인 컨텐츠 스크롤 영역 -->
    <main class="flex-1 overflow-y-auto pb-6">

      <!-- ATF 정보 헤더 Card -->
      <div class="p-4 bg-white border-b border-[#E6E6E6]">
        <div class="bg-[#FAFAFA] border border-[#E6E6E6] rounded-[16px] p-4 shadow-flat">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[11px] font-bold text-[#1D8BFF] bg-[#E3F0FF] px-2 py-0.5 rounded">대만 타이베이</span>
          </div>
          <h1 class="font-jalnan text-base text-[#222222] mb-0.5">대만 동기 여행 일정</h1>
          <p class="text-xs font-semibold text-[#F94239] mb-1.5">✈️ 맛있는 미식과 신나는 추억이 가득한 2박 3일 타이베이 우정 여행!</p>
          <p class="text-xs text-[#5C5C5C] font-medium">1월 9일 - 1월 11일 <span class="text-[#222222] font-bold">(2박 3일)</span></p>
        </div>

        <!-- 모바일 일차 선택 탭 -->
        <div class="flex space-x-1.5 mt-3 overflow-x-auto no-scrollbar" id="day-tabs">
          <button onclick="switchDay(1)" id="tab-day-1" class="day-tab flex-1 py-2 px-2 text-xs font-bold text-center rounded-[10px] bg-[#F94239] text-white transition active:scale-95">
            1일차 (1/9)
          </button>
          <button onclick="switchDay(2)" id="tab-day-2" class="day-tab flex-1 py-2 px-2 text-xs font-bold text-center rounded-[10px] bg-[#F5F5F5] text-[#707070] transition active:scale-95">
            2일차 (1/10)
          </button>
          <button onclick="switchDay(3)" id="tab-day-3" class="day-tab flex-1 py-2 px-2 text-xs font-bold text-center rounded-[10px] bg-[#F5F5F5] text-[#707070] transition active:scale-95">
            3일차 (1/11)
          </button>
        </div>
      </div>

      <!-- 타임라인 스케줄 리스트 영역 -->
      <div class="p-4 space-y-3" id="timeline-container">
        <!-- JS 동적 생성 -->
      </div>

      <!-- 일차 이동 네비게이션 버튼 영역 -->
      <div class="px-4 pb-4" id="day-nav-container">
        <!-- JS 동적 생성 -->
      </div>
    </main>

  </div>

  <script>

        { id: 102, name: "아침식사 (시먼누들)", category: "식당", time: "09:30~10:30", memo: "진한 육수와 우육면, 족발덮밥 맛집", image: "시먼누들.jpeg", info: "시먼역 근처 위치 / 대표메뉴: 우육면, 족발덮밥" },
        { id: 103, name: "시먼딩 나들이 & 발마사지", category: "관광지", time: "10:30~11:30", memo: "번화가 구경 및 여행 피로 해소 발마사지", image: "2일차 시먼딩.jpeg", info: "타이베이의 명동 / 발마사지 전문점 다수 상주" },
        { id: 104, name: "점심식사 (지아펀 훠궈)", category: "식당", time: "11:30~13:00", memo: "고소한 우유탕 훠궈로 유명한 맛집", image: "지아펀.jpeg", info: "인기 1인 훠궈 전문점 / 우유 육수 추천" },
        { id: 105, name: "예스지 투어", category: "관광지", time: "13:00~21:30", memo: "예류 해양공원, 스펀 천등 날리기, 지우펀 홍등 관람", image: "예스지투어.jpeg", info: "대만 필수 코스 / 예류·스펀·지우펀 주요 명소" },
        { id: 106, name: "뒷풀이 및 야시장 (선택)", category: "식당", time: "21:30~", memo: "1. 숙소 근처 뒷풀이 (무단/Casa Bar/西門內疆串燒)\n2. 라오허제 야시장 방문", image: "casa bar.jpeg", info: "대만의 밤문화 및 미식 거리 체험" },
        { id: 107, name: "숙소 복귀 및 휴식", category: "숙소", time: "23:00~", memo: "1일차 일정을 마치고 숙소 취침", image: "숙소.jpg", info: "취침 및 2일차 준비" }
      ],
      2: [
        { id: 201, name: "기상 및 준비", category: "숙소", time: "~08:30", memo: "기상 및 아침 일정 준비", image: "숙소.jpg", info: "상쾌한 아침 시작" },
        { id: 202, name: "아침식사 (용허또우장)", category: "식당", time: "08:30~09:30", memo: "따뜻한 또우장(두유)과 요우티아오(튀김빵)", image: "용허또우장.jpeg", info: "대만 현지인 스타일의 전통 아침 식사" },
        { id: 203, name: "발마사지 (西門足體養生館)", category: "관광지", time: "09:30~10:30", memo: "시먼 위치 발마사지 전문점에서 휴식", image: "발마사지.jpeg", info: "시먼 중심가 전문 마사지샵" },
        { id: 204, name: "시먼딩 관광", category: "관광지", time: "10:30~12:00", memo: "시먼 상권 및 쇼핑거리 탐방", image: "시먼딩.jpeg", info: "다양한 매장과 거리 기념품 상점 위치" },
        { id: 205, name: "점심식사 (근래철판구이)", category: "식당", time: "12:00~13:30", memo: "즉석에서 볶아주는 대만식 철판 요리", image: "근래철판구이.jpeg", info: "시먼 가성비 최고 철판구이 전문점" },
        { id: 206, name: "시먼딩 관광 & 휴식", category: "카페", time: "13:30~15:30", memo: "주변 카페 이용 및 행복당 버블티, 자유시간", image: "시먼딩 카페.jpeg", info: "카페 휴식 및 버블티/쇼핑 타임" },
        { id: 207, name: "보피랴오거리 & 용산사", category: "관광지", time: "15:30~17:00", memo: "청나라 역사 거리 탐방 및 280년 역사 사찰 참배", image: "용산사.jpeg", info: "타이베이에서 가장 오래된 유명 전통 사찰" },
        { id: 208, name: "저녁식사 (진천미)", category: "식당", time: "17:00~18:00", memo: "파볶음과 연두부튀김이 일품인 타이완 요리 맛집", image: "진천미.jpeg", info: "한국인 입맛에 잘 맞는 시먼 대표 요리집" },
        { id: 209, name: "다다오청 강변 야경", category: "관광지", time: "18:00~19:30", memo: "디화제거리 건축물 감상 및 강변 노을/야경 산책", image: "다다오청.jpeg", info: "아름다운 강변 산책로 및 감성 야경 명소" },
        { id: 210, name: "뒷풀이 (오무라타케시 이자카야)", category: "식당", time: "19:30~21:30", memo: "분위기 좋은 일본식 선술집에서 뒷풀이", image: "오무라타케시 이자카야.jpeg", info: "꼬치구이와 주류 전문 수제 이자카야" },
        { id: 211, name: "3차 이동 또는 숙소", category: "숙소", time: "21:30~", memo: "추가 모임 진행 또는 숙소 이동", image: "숙소.jpg", info: "2일차 일정을 마치고 휴식" }
      ],
      3: [
        { id: 301, name: "기상 및 준비", category: "숙소", time: "~09:00", memo: "기상 후 퇴실 준비", image: "숙소.jpg", info: "마지막 날 일정 준비" },
        { id: 302, name: "아침식사 (일갑자찬음)", category: "식당", time: "09:00~10:00", memo: "미슐랭 빕구르망 선정 동파육 덮밥 & 대만식 버거", image: "일갑자찬음.jpeg", info: "대표 메뉴: 동파육 덮밥(콩로우판), 꽈바오" },
        { id: 303, name: "짐정리 및 체크아웃", category: "숙소", time: "10:00~11:00", memo: "짐 정리 완료 후 숙소 체크아웃", image: "짐정리.jpeg", info: "짐 보관 서비스 이용" },
        { id: 304, name: "중정기념관", category: "관광지", time: "11:00~12:00", memo: "대만 초대 총통 장제스를 기념하는 역사적 명소 관람", image: "중정기념관.jpeg", info: "웅장한 정문 및 매시 정각 정시 근위병 교대식 관람" },
        { id: 305, name: "융캉공원 및 융캉제 산책", category: "관광지", time: "12:00~13:30", memo: "도심 속 푸른 융캉공원과 아기자기한 융캉제 거리 탐방", image: "융캉제.jpeg", info: "유명 디저트, 소품샵, 감성 카페가 가득한 상권" },
        { id: 306, name: "점심식사 (딘타이펑 신성점)", category: "식당", time: "13:30~15:00", memo: "세계적인 딤섬 전문점, 샤오롱바오 & 볶음밥", image: "딘다이펑.jpeg", info: "대표 메뉴: 육즙 가득한 샤오롱바오, 계란볶음밥" },
        { id: 307, name: "까르푸 & 시먼딩 쇼핑", category: "관광지", time: "15:00~17:00", memo: "대만 기념품, 펑리수, 망고젤리 쇼핑", image: "까르푸.jpeg", info: "24시간 운영 기념품 필수 구매 대형마트" },
        { id: 308, name: "공항 이동", category: "관광지", time: "17:00~18:00", memo: "공항철도(MRT) 이용 또는 차편으로 타오위안 공항 이동", image: "공항 이동.jpeg", info: "타오위안 국제공항 이동" },
        { id: 309, name: "출국 수속 & 면세점 & 저녁", category: "관광지", time: "18:00~20:00", memo: "출국 수속 진행, 면세점 구경 및 공항 저녁 식사", image: "출국수속.jpeg", info: "여유로운 탑승 준비" },
        { id: 310, name: "한국으로 출발", category: "관광지", time: "20:00~", memo: "귀국 비행기 탑승 및 출발", image: "https://images.unsplash.com/photo-1542296332-2e4473faf563?auto=format&fit=crop&w=600&q=80", info: "여행 일정 종료" }
      ]
    };

    window.onload = function() {
      renderTimeline();
    };

    function switchDay(day) {
      currentDay = day;

      document.querySelectorAll('.day-tab').forEach((tab, idx) => {
        if (idx + 1 === day) {
          tab.className = "day-tab flex-1 py-2 px-2 text-xs font-bold text-center rounded-[10px] bg-[#F94239] text-white transition active:scale-95";
        } else {
          tab.className = "day-tab flex-1 py-2 px-2 text-xs font-bold text-center rounded-[10px] bg-[#F5F5F5] text-[#707070] transition active:scale-95";
        }
      });

      const dayPlaces = scheduleData[currentDay] || [];
      selectedPlaceId = dayPlaces.length > 0 ? dayPlaces[0].id : null;

      renderTimeline();

      // 스크롤을 맨 위로 이동
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.scrollTop = 0;
      }
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      container.innerHTML = '';

      const places = scheduleData[currentDay] || [];

      if (places.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center bg-white rounded-[16px] border border-[#E6E6E6]">
            <div class="text-xs font-bold text-[#8B8B8B]">등록된 일정이 없습니다</div>
          </div>
        `;
        renderDayNavigation();
        return;
      }

      places.forEach((item, index) => {
        const isSelected = item.id === selectedPlaceId;
        const cardClass = isSelected 
          ? "bg-[#FFF5F5] border-[#F94239] shadow-flat" 
          : "bg-white border-[#E6E6E6] active:bg-[#FAFAFA]";

        const categoryBadgeColor = item.category === '숙소' ? 'bg-[#EDEBFF] text-[#7059FA]' 
          : item.category === '식당' ? 'bg-[#FFE7D6] text-[#FF7847]' 
          : item.category === '카페' ? 'bg-[#FFF4D8] text-[#FFB803]' 
          : 'bg-[#E3F0FF] text-[#1D8BFF]';

        const formattedMemo = item.memo ? item.memo.replace(/\n/g, '<br>') : '';
        
        // 이미지 로딩 오류 발생 시 대체 이미지 대신 이미지가 없는 것처럼 숨김 처리하도록 onerror 지정
        const imgSrc = item.image ? encodeURI(item.image) : '';

        const html = `
          <div class="relative pl-6">
            ${index < places.length - 1 ? '<div class="absolute left-2.5 top-6 bottom-0 w-0.5 bg-[#E6E6E6]"></div>' : ''}
            
            <div class="absolute left-0 top-3.5 w-5 h-5 rounded-full ${isSelected ? 'bg-[#F94239] text-white' : 'bg-[#222222] text-white'} text-[10px] font-bold flex items-center justify-center num-tabular z-10">
              ${index + 1}
            </div>

            <div onclick="selectPlace(${item.id})" class="p-3.5 rounded-[16px] border transition ${cardClass}">
              <div class="flex items-center space-x-1.5 mb-1.5">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${categoryBadgeColor}">${item.category}</span>
                <span class="text-xs font-semibold text-[#707070] num-tabular">${item.time}</span>
              </div>

              <div class="font-bold text-sm text-[#222222] mb-1">${item.name}</div>

              ${imgSrc ? `
                <div class="w-full h-36 rounded-[12px] overflow-hidden my-2 bg-[#F5F5F5] border border-[#E6E6E6] flex items-center justify-center relative">
                  <img src="${imgSrc}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'flex flex-col items-center justify-center p-4 text-center text-[#999999]\'><svg class=\'w-6 h-6 mb-1 text-[#DCDCDC]\' fill=\'none\' stroke=\'currentColor\' viewBox=\'0 0 24 24\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z\'></path></svg><span class=\'text-[11px] font-medium\'>${item.name}</span></div>';">
                </div>
              ` : ''}

              ${item.info ? `
                <div class="bg-[#F5F5F5] p-2 rounded-[8px] my-1.5 text-[11px] text-[#222222] font-semibold border border-[#E6E6E6]">
                  ${item.info}
                </div>
              ` : ''}

              ${item.memo ? `<div class="text-xs text-[#5C5C5C] font-medium leading-relaxed">${formattedMemo}</div>` : ''}
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });

      renderDayNavigation();
    }

    function renderDayNavigation() {
      const navContainer = document.getElementById('day-nav-container');
      if (!navContainer) return;

      let navHtml = '';

      if (currentDay === 1) {
        navHtml = `
          <button onclick="switchDay(2)" class="w-full py-3 px-4 bg-white border border-[#E6E6E6] rounded-[14px] text-xs font-bold text-[#222222] hover:bg-[#FAFAFA] active:scale-[0.99] transition flex items-center justify-center space-x-2 shadow-flat">
            <span>2일차(1/10) 일정 보기</span>
            <svg class="w-4 h-4 text-[#F94239]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
        `;
      } else if (currentDay === 2) {
        navHtml = `
          <div class="flex space-x-2">
            <button onclick="switchDay(1)" class="flex-1 py-3 px-3 bg-white border border-[#E6E6E6] rounded-[14px] text-xs font-bold text-[#222222] hover:bg-[#FAFAFA] active:scale-[0.99] transition flex items-center justify-center space-x-1 shadow-flat">
              <svg class="w-4 h-4 text-[#707070]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
              <span>1일차 보기</span>
            </button>
            <button onclick="switchDay(3)" class="flex-1 py-3 px-3 bg-white border border-[#E6E6E6] rounded-[14px] text-xs font-bold text-[#222222] hover:bg-[#FAFAFA] active:scale-[0.99] transition flex items-center justify-center space-x-1 shadow-flat">
              <span>3일차 보기</span>
              <svg class="w-4 h-4 text-[#F94239]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
          </div>
        `;
      } else if (currentDay === 3) {
        navHtml = `
          <button onclick="switchDay(2)" class="w-full py-3 px-4 bg-white border border-[#E6E6E6] rounded-[14px] text-xs font-bold text-[#222222] hover:bg-[#FAFAFA] active:scale-[0.99] transition flex items-center justify-center space-x-2 shadow-flat">
            <svg class="w-4 h-4 text-[#707070]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            <span>2일차(1/10) 일정 보기</span>
          </button>
        `;
      }

      navContainer.innerHTML = navHtml;
    }

    function selectPlace(id) {
      selectedPlaceId = id;
      renderTimeline();
    }
  </script>
</body>
</html>
